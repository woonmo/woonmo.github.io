name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * *'  # 매일 자정 KST (UTC+9 → UTC 15:00)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout blog repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Clear default content
        run: rm -rf content

      - name: Checkout obsidian-vault into content/
        uses: actions/checkout@v7
        with:
          repository: woonmo/obsidian-vault
          token: ${{ secrets.VAULT_PAT }}
          path: content

      - name: Filter publish:true notes only
        run: |
          # publish: true 없는 마크다운 파일 제거
          find content -name "*.md" -type f | while IFS= read -r f; do
            if ! grep -qP "^publish:\s*\"?true\"?" "$f"; then
              rm "$f"
            fi
          done
          echo "Remaining files:"
          find content -name "*.md" | wc -l

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Cache Quartz plugins
        uses: actions/cache@v6
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-

      - name: Install dependencies
        run: npm ci

      - name: Install Quartz plugins
        run: npx quartz plugin install

      - name: Build
        run: npx quartz build -d content -o public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
